tagline: "Health that starts from the person"
kicker: "Scientist working towards personalised health"
hero_lead: "No two people are the same."
hero_paragraphs:
  - "Two people can follow the same diet and see their health change in different ways. The same exercise can bring one person a large weight loss and another almost none. Two people can share a diagnosis, similar symptoms and the same treatment, and still respond differently. One improves a great deal while the other barely changes."
  - "These differences are not noise around an average. They are part of human biology. We are all unique, and different from one another, even when we can be grouped by what we share, and I want to understand why."
statement_eyebrow: "Why I do this"
statement_aside: "The biology is in the variation between individuals."
values_title: "What I stand for"
values:
  - "Health that starts from the person"
  - "Statistics that report their uncertainty"
  - "Fair use of data, and fair benefit from it"
  - "Reproducible research"
  - "Open science"
statement_paragraphs:
  - "My research combines genetics, statistics and human biology. I study how genetic variation contributes to differences in metabolic and psychiatric health, from insulin sensitivity, obesity and type 2 diabetes to the biology that obesity shares with psychiatric disorders."
  - "This interest grew out of a career path that did not run in a straight line. I have moved through several fields of health, medicine and biology, from protein biochemistry, developmental biology and cancer genomics at the bench, through experimental disease models, to statistics, data science and human genetics. Each field taught me to look at health from a different level, first molecules and cells, then organisms, and finally populations."
  - "Moving between these fields also taught me how to approach a question. Look beyond the average. Test the result. Ask what biology could explain it. Build the tools that let others do the same."
  - "Today I work with large-scale human data and statistical genetics to move from association towards understanding. Each person carries a unique combination of genetic variants, part of what makes them who they are and part of why their risk of disease differs from that of others. Reading this variation, together with what can be measured in the person, is the first step towards an understanding of health, disease and treatment that starts from the individual."
subheadline: "Health that starts from the person. Research tools, courses and open science for metabolic and mental health."
