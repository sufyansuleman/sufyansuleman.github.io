tagline: "Health that starts from the person"
hero_lead: "No two people are the same."
hero_paragraphs:
  - "Two people can follow the same diet and see their health change in different ways. The same exercise can bring one person a large weight loss and another almost none. Two people can share a diagnosis, similar symptoms and the same treatment, and still respond differently. One improves a great deal while the other barely changes."
  - "These differences are not noise around an average. They are part of human biology. We are all unique, and different from one another, even when we can be grouped by what we share, and I want to understand why."
statement_paragraphs:
  - "My research combines genetics, statistics and human biology. I study how genetic variation, together with measurable traits of the individual, contributes to differences in metabolic and psychiatric health. This ranges from insulin sensitivity, obesity and type 2 diabetes to the biology that obesity shares with psychiatric disorders."
  - "This interest was shaped by my career path, which did not run in a straight line. I have moved through several fields of health, medicine and biology, from protein biochemistry, developmental biology and cancer genomics at the bench, through experimental disease models, to statistics, data science and the genetics of human populations. Each field taught me to look at health from a different level, first molecules and cells, then organisms, and finally large groups of people."
  - "Moving between these fields also shaped how I approach a question. Look beyond the average. Test the result. Ask what biology could explain it. Build the tools that let others do the same."
  - "Today I work with large-scale human data, statistical genetics and computational methods to move from association towards understanding. The aim is to go from finding patterns in populations to asking what those patterns say about the biology of an individual."
  - "Each person carries a unique combination of genetic variants. That combination is part of what makes an individual who they are, and it also shapes how their risk of disease differs from that of others. Reading this variation, together with what can be measured in the person, is the first step towards an understanding of health, disease and treatment that starts from the individual."
subheadline: "Health that starts from the person: research tools, courses and open science for metabolic and mental health."
