bio_short: "Computational biologist and geneticist studying metabolic and psychiatric disease, with a background in biotechnology and molecular biology. Postdoctoral researcher at Aarhus University and the Broad Institute; builds open-source R tools, reproducible pipelines and courses that make genomic and clinical data more usable."
bio_long: |
  Sufyan Suleman is a computational biologist and geneticist working on the shared genetics of metabolic and psychiatric disease. He trained in biotechnology and molecular biology before moving to statistical genetics, and is now a postdoctoral researcher in the Department of Biomedicine at Aarhus University, and an affiliate scientist at the Novo Nordisk Foundation Center for Genomic Mechanisms of Disease at the Broad Institute of MIT and Harvard. His doctoral work at the Novo Nordisk Foundation Center for Basic Metabolic Research, University of Copenhagen, established the genetic architecture of insulin sensitivity and its links to type 2 diabetes, obesity, and cardiovascular disease, producing three first-author publications. His current postdoctoral research investigates the shared genetic architecture and biological mechanisms of obesity and ADHD, combining polygenic risk scoring, Mendelian randomisation, PheWAS, and integrative genomics across large population cohorts.

  Alongside his research, Sufyan develops open-source R packages for biomarker and insulin-sensitivity calculation, contributes to widely used genomics tooling, and builds openly licensed courses in R and statistics. He has contributed to international genetics consortia including MAGIC and SpiroMeta, and his earlier research career included functional cancer genomics and developmental biology work in Oulu, Finland. He is committed to reproducible research practices and to making quantitative genetics and biostatistics methods accessible through open software and teaching.
