items:
  - slug: HealthMarkers
    category: tool
    title: HealthMarkers
    tagline: Clinical, metabolic and cardiovascular biomarker calculations in R
    icon: lucide:activity
    featured: true
    tags: [R package, biomarkers, cardiometabolic]
    links:
      site: https://sufyansuleman.github.io/HealthMarkers/
      docs: https://sufyansuleman.github.io/HealthMarkers/
      github: https://github.com/sufyansuleman/HealthMarkers
      doi: https://doi.org/10.5281/zenodo.20668335
    cover:
      what: "Clinical and cardiometabolic biomarker calculations in R"
      audience: "Researchers working with clinical trial or cohort data"
      keyword: "Health"
      motif: heartbeat
    cta:
      question: "Do you have data with hundreds of variables and need the standard indices out of it?"
      detail: "HealthMarkers computes over 290 of them from a single table. I can help you map your columns, choose the right markers, and run it on your cohort."

