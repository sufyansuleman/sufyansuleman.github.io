projects:
  - slug: adhd-obesity-genetics
    title: "ADHD x obesity shared genetics"
    status: active
    period:
      start: "2024-09"
    summary: "Investigating shared genetic architecture and biological mechanisms between ADHD and obesity using polygenic scoring, Mendelian randomisation, PheWAS, and integrative genomics across biobank-scale cohorts."
    role: "Lead analyst (postdoc)"
    methods:
      - "SBayesRC polygenic risk scoring"
      - "Bidirectional Mendelian randomisation"
      - "PheWAS across 1,434 ICD-10 phecodes"
      - "MiXeR, LAVA, LDSC genetic correlation"
      - "ASSET and METASOFT cross-trait meta-analysis"
      - "FUMA, MAGMA, FINEMAP, PoPS, FLAMES gene prioritisation"
      - "scDRS single-cell disease relevance scoring"
      - "CellProfiler / LipocyteProfiler imaging integration"
    outcomes:
      - "Manuscript in preparation (first author)"
    related:
      publications: []
      tools: []
      courses: []
    milestones: []

  - slug: insulin-sensitivity-genetics
    title: "Genetics of insulin sensitivity and T2D"
    status: completed
    period:
      start: "2021-06"
      end: "2024-11"
    summary: "PhD research establishing the genetic architecture of insulin sensitivity and its links to type 2 diabetes, obesity, and cardiovascular disease, using GWAS of 21 indices in Danish cohorts."
    role: "PhD researcher"
    methods:
      - "GWAS of 21 insulin sensitivity indices"
      - "Genetic risk score development"
      - "Cross-cohort validation (adult to paediatric)"
    outcomes:
      - "Three first-author publications"
      - "PhD thesis submitted and defended"
    related:
      publications:
        - "10.1210/clinem/dgae275"
        - "10.1210/clinem/dgae882"
        - "10.1038/s41598-025-98507-w"
      tools: []
      courses: []

